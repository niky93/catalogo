<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Administrar Anzuelo & Llama</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="admin-page">
    <main class="admin-shell">
      <section class="admin-card">
        <div class="dialog-heading">
          <div>
            <img class="admin-logo" src="logo.png" alt="Logo de Anzuelo & Llama" />
            <p class="eyebrow">Anzuelo & Llama</p>
            <h1>Administrar productos</h1>
          </div>
          <a class="button secondary-button" href="index.html">Ver catalogo</a>
        </div>

        <form id="login-form" class="admin-form">
          <label>
            <span>Correo</span>
            <input name="email" type="email" autocomplete="email" required />
          </label>
          <label>
            <span>Contrasena</span>
            <input name="password" type="password" autocomplete="current-password" required />
          </label>
          <p class="form-error" id="login-error"></p>
          <button class="button" type="submit">Ingresar</button>
        </form>

        <form id="admin-form" class="admin-form" hidden>
          <input id="product-id" type="hidden" />
          <label>
            <span>Nombre</span>
            <input id="product-name" required maxlength="120" />
          </label>
          <label>
            <span>Categoria</span>
            <input id="product-category" required maxlength="80" />
          </label>
          <label>
            <span>Precio (Bs)</span>
            <input id="product-price" type="number" min="0" step="0.01" required />
          </label>
          <label>
            <span>Foto</span>
            <input id="product-image" type="file" accept="image/*" required />
          </label>
          <label>
            <span>Descripcion</span>
            <textarea id="product-description" rows="3" maxlength="500" required></textarea>
          </label>
          <p class="form-error" id="admin-error"></p>
          <div class="admin-actions">
            <button class="button" id="save-product-button" type="submit">Guardar producto</button>
            <button class="admin-button" id="cancel-edit-button" type="button" hidden>Cancelar edicion</button>
            <button class="admin-button" id="logout-button" type="button" hidden>Salir</button>
          </div>
        </form>

        <section id="product-manager" class="product-manager" hidden>
          <div class="manager-heading">
            <div>
              <p class="eyebrow">Inventario</p>
              <h2>Productos cargados</h2>
            </div>
            <button class="admin-button" id="refresh-products-button" type="button">Actualizar</button>
          </div>
          <p class="form-error" id="manager-error"></p>
          <div class="admin-product-list" id="admin-product-list"></div>
          <p class="empty-state admin-empty-state" id="admin-empty-state" hidden>No hay productos cargados todavia.</p>
        </section>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="productos.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
